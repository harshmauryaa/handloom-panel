<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handloom Panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span>Handloom Panel</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" data-tab="split">Split</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="split-nowhite">Split (No White)</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="merge">Merge</button>
    </nav>
  </header>

  <main>
    <!-- Each panel is filled in by js/app.js -->
    <section class="tab-panel active" id="tab-split" role="tabpanel"></section>
    <section class="tab-panel" id="tab-split-nowhite" role="tabpanel"></section>
    <section class="tab-panel" id="tab-merge" role="tabpanel"></section>
  </main>

  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="js/bmp.js"></script>
  <script src="js/split.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
